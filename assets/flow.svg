<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="工作流：你说一句话，Agent 读 SKILL.md 决定调用 Reelflow API，图片与数据回到对话里">
  <defs>
    <linearGradient id="b2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0B63F6"/><stop offset="1" stop-color="#8B22E8"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L10 6 L1 11 Z" fill="#6E67A8"/>
    </marker>
    <clipPath id="r2"><rect width="1200" height="420" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#r2)" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
    <rect width="1200" height="420" fill="#0A0A12"/>
    <rect width="1200" height="420" fill="#6C4BF0" fill-opacity="0.05"/>

    <text x="60" y="66" fill="#8E88C4" font-size="16" letter-spacing="3">HOW IT WORKS</text>
    <text x="60" y="104" fill="#FFFFFF" font-size="30" font-weight="700">你只管说人话，剩下的 Agent 自己办</text>

    <!-- 四步 -->
    <g>
      <!-- 1 -->
      <g transform="translate(60 150)">
        <rect width="240" height="180" rx="18" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
        <circle cx="34" cy="38" r="15" fill="url(#b2)"/>
        <text x="34" y="44" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle">1</text>
        <text x="62" y="44" fill="#FFFFFF" font-size="19" font-weight="600">你开口</text>
        <text x="24" y="88" fill="#B9B4E0" font-size="15">「查小红书『露营』</text>
        <text x="24" y="112" fill="#B9B4E0" font-size="15">的热门笔记」</text>
        <text x="24" y="150" fill="#6E67A8" font-size="13">不用记端点，不用写参数</text>
      </g>
      <line x1="310" y1="240" x2="336" y2="240" stroke="#6E67A8" stroke-width="2" marker-end="url(#arw)"/>

      <!-- 2 -->
      <g transform="translate(340 150)">
        <rect width="240" height="180" rx="18" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
        <circle cx="34" cy="38" r="15" fill="url(#b2)"/>
        <text x="34" y="44" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle">2</text>
        <text x="62" y="44" fill="#FFFFFF" font-size="19" font-weight="600">Agent 读 Skill</text>
        <text x="24" y="88" fill="#B9B4E0" font-size="15">SKILL.md 告诉它</text>
        <text x="24" y="112" fill="#B9B4E0" font-size="15">何时调、怎么调</text>
        <text x="24" y="150" fill="#6E67A8" font-size="13">纯文档，零服务端</text>
      </g>
      <line x1="590" y1="240" x2="616" y2="240" stroke="#6E67A8" stroke-width="2" marker-end="url(#arw)"/>

      <!-- 3 -->
      <g transform="translate(620 150)">
        <rect width="240" height="180" rx="18" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
        <circle cx="34" cy="38" r="15" fill="url(#b2)"/>
        <text x="34" y="44" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle">3</text>
        <text x="62" y="44" fill="#FFFFFF" font-size="19" font-weight="600">调 Reelflow API</text>
        <text x="24" y="88" fill="#B9B4E0" font-size="15">14 个平台 · 251 端点</text>
        <text x="24" y="112" fill="#B9B4E0" font-size="15">生图 / 封面 / 数据</text>
        <text x="24" y="150" fill="#6E67A8" font-size="13">一把 Key 全通</text>
      </g>
      <line x1="870" y1="240" x2="896" y2="240" stroke="#6E67A8" stroke-width="2" marker-end="url(#arw)"/>

      <!-- 4 -->
      <g transform="translate(900 150)">
        <rect width="240" height="180" rx="18" fill="url(#b2)" fill-opacity="0.16" stroke="#8B7BF0" stroke-opacity="0.45"/>
        <circle cx="34" cy="38" r="15" fill="url(#b2)"/>
        <text x="34" y="44" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle">4</text>
        <text x="62" y="44" fill="#FFFFFF" font-size="19" font-weight="600">出活</text>
        <text x="24" y="88" fill="#E6E3FA" font-size="15">图片、结构化</text>
        <text x="24" y="112" fill="#E6E3FA" font-size="15">数据回到对话</text>
        <text x="24" y="150" fill="#9C93D8" font-size="13">失败不扣费</text>
      </g>
    </g>

    <text x="60" y="382" fill="#6E67A8" font-size="15">按量消耗工作区积分：数据 2 积分/次，生图默认 3 积分/张 · 详见 reelflowai.app</text>
  </g>
</svg>
